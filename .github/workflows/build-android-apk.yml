name: Build CHEDAR AI KREATOR APK

on:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare Android app
        run: |
          mkdir -p android-wrapper/www android-wrapper/assets
          cp public/icon.svg android-wrapper/assets/icon.svg
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/assets sharp
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('assets/icon.svg')
            .resize(1024, 1024, { fit: 'contain', background: '#101827' })
            .png()
            .toFile('assets/icon-only.png');
          NODE
          cat > www/index.html <<'HTML'
          <!doctype html>
          <html lang="id">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="theme-color" content="#101827">
            <title>CHEDAR AI KREATOR</title>
            <style>html,body{margin:0;width:100%;height:100%;background:#0b1220}body{font-family:Arial,sans-serif}</style>
          </head>
          <body></body>
          </html>
          HTML
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.chedar.aikreator",
            "appName": "CHEDAR AI KREATOR",
            "webDir": "www",
            "server": {
              "url": "https://agus-ai-video-studio.vercel.app",
              "cleartext": false,
              "allowNavigation": ["agus-ai-video-studio.vercel.app"]
            },
            "android": {
              "allowMixedContent": false
            }
          }
          JSON
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

          mkdir -p android/app/src/main/java/com/chedar/aikreator
          cat > android/app/src/main/java/com/chedar/aikreator/FlowLauncherPlugin.java <<'JAVA'
          package com.chedar.aikreator;

          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "FlowLauncher")
          public class FlowLauncherPlugin extends Plugin {
              private static final String FLOW_PACKAGE = "com.google.android.apps.labs.whisk";

              @PluginMethod
              public void openFlow(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      Intent launchIntent = getContext().getPackageManager()
                          .getLaunchIntentForPackage(FLOW_PACKAGE);
                      if (launchIntent != null) {
                          getActivity().startActivity(launchIntent);
                          call.resolve();
                          return;
                      }
                      try {
                          getActivity().startActivity(new Intent(Intent.ACTION_VIEW,
                              Uri.parse("market://details?id=" + FLOW_PACKAGE)));
                      } catch (ActivityNotFoundException error) {
                          getActivity().startActivity(new Intent(Intent.ACTION_VIEW,
                              Uri.parse("https://play.google.com/store/apps/details?id=" + FLOW_PACKAGE)));
                      }
                      JSObject result = new JSObject();
                      result.put("installed", false);
                      call.resolve(result);
                  });
              }
          }
          JAVA

          cat > android/app/src/main/java/com/chedar/aikreator/MainActivity.java <<'JAVA'
          package com.chedar.aikreator;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FlowLauncherPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('<application', '<queries><package android:name="com.google.android.apps.labs.whisk" /></queries>\\n    <application', 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android-wrapper/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: chedar-ai-kreator-android-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
